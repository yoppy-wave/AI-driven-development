name: Implement AI coding issues

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ai-coding-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    if: github.event.label.name == 'ai-coding'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install GitHub Copilot CLI
        run: npm install --global @github/copilot

      - name: Prepare the implementation request
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python .github/scripts/ai_coding.py prepare
          cp .github/scripts/ai_coding.py "$RUNNER_TEMP/ai-coding-helper.py"

      - name: Implement and test with Copilot
        id: coding
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          COPILOT_MODEL: ${{ vars.COPILOT_MODEL }}
          COPILOT_AUTO_UPDATE: 'false'
        run: |
          if [[ -z "$COPILOT_GITHUB_TOKEN" ]]; then
            echo '::error::Repository secret COPILOT_GITHUB_TOKEN is not configured.'
            exit 1
          fi

          base_sha="$(git rev-parse HEAD)"
          timeout --signal=TERM 2700s copilot \
            -p "$(cat "$RUNNER_TEMP/ai-coding-prompt.txt")" -s \
            --available-tools='bash,list_bash,read_bash,stop_bash,write_bash,apply_patch,create,edit,view,grep,glob' \
            --allow-tool='read,write,shell' \
            --deny-tool='shell(git commit),shell(git push)' \
            --no-ask-user --secret-env-vars=COPILOT_GITHUB_TOKEN \
            > "$RUNNER_TEMP/ai-coding-output.txt"

          if [[ "$(git rev-parse HEAD)" != "$base_sha" ]]; then
            echo '::error::Copilot created a commit; this workflow expects uncommitted changes.'
            exit 1
          fi

          git diff --check
          python "$RUNNER_TEMP/ai-coding-helper.py" extract

          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            echo 'has_changes=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_changes=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update a draft pull request
        id: pr
        if: steps.coding.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.AI_CODING_PR_TOKEN || secrets.GITHUB_TOKEN }}
          base: ${{ github.event.repository.default_branch }}
          branch: ai-coding/issue-${{ github.event.issue.number }}
          commit-message: 'Implement issue #${{ github.event.issue.number }} with Copilot'
          title: 'AI実装: issue #${{ github.event.issue.number }}'
          body-path: ${{ runner.temp }}/ai-coding-pr-body.md
          draft: true

      - name: Report when no pull request was created
        if: steps.coding.outputs.has_changes == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/ai-coding-no-change.md"

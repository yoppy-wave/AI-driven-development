name: Answer AI questions

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: ai-question-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  answer:
    if: github.event.label.name == 'ai-question'
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out the source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install GitHub Copilot CLI
        run: npm install --global @github/copilot

      - name: Prepare the question
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python .github/scripts/ai_question.py prepare

      - name: Inspect source and draft an answer
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          COPILOT_MODEL: ${{ vars.COPILOT_MODEL }}
          COPILOT_AUTO_UPDATE: 'false'
        run: |
          if [[ -z "$COPILOT_GITHUB_TOKEN" ]]; then
            echo '::error::Repository secret COPILOT_GITHUB_TOKEN is not configured.'
            exit 1
          fi

          timeout --signal=TERM 1200s copilot \
            -p "$(cat "$RUNNER_TEMP/ai-question-prompt.txt")" -s \
            --available-tools='view,grep,glob' \
            --allow-tool=read --deny-tool=write --no-ask-user \
            --secret-env-vars=COPILOT_GITHUB_TOKEN \
            > "$RUNNER_TEMP/ai-question-output.txt"

          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            echo '::error::Copilot changed files in the checkout; the answer will not be posted.'
            exit 1
          fi

          python .github/scripts/ai_question.py extract

      - name: Post the answer to the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/ai-question-answer.md"

name: Answer AI questions

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: ai-question-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  answer:
    if: github.event.label.name == 'ai-question'
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out the source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install Cline CLI
        run: npm install --global cline@3.0.70

      - name: Prepare the question and read-only Cline hook
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python .github/scripts/ai_question.py prepare
          mkdir -p "$HOME/.cline/hooks"
          cp .github/scripts/ai_question.py "$HOME/.cline/hooks/PreToolUse.py"
          chmod +x "$HOME/.cline/hooks/PreToolUse.py"

      - name: Inspect source and draft an answer
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLINE_MODEL: ${{ vars.CLINE_MODEL || 'gpt-5.4' }}
        run: |
          if [[ -z "$OPENAI_API_KEY" ]]; then
            echo '::error::Repository secret OPENAI_API_KEY is not configured.'
            exit 1
          fi

          cline --json --plan --auto-approve true --timeout 1200 \
            --provider openai --model "$CLINE_MODEL" \
            '標準入力の質問を、現在のリポジトリを調べて回答してください。' \
            < "$RUNNER_TEMP/ai-question-prompt.txt" \
            > "$RUNNER_TEMP/ai-question-events.ndjson"

          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            echo '::error::Cline changed files in the checkout; the answer will not be posted.'
            exit 1
          fi

          python .github/scripts/ai_question.py extract

      - name: Post the answer to the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/ai-question-answer.md"

name: Clean up preview environment

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: cicd-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cleanup-target:
    runs-on: ubuntu-24.04
    outputs:
      found: ${{ steps.target.outputs.found }}
      work-directory: ${{ steps.target.outputs.work_directory }}
      backend-url: ${{ steps.target.outputs.backend_url }}
      stack-name: ${{ steps.target.outputs.stack_name }}
      worker-name: ${{ steps.target.outputs.worker_name }}
      source-ref: ${{ steps.target.outputs.source_ref }}
    steps:
      - name: Check out CI/CD cleanup helper
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Recover recorded preview cleanup target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            | python .github/scripts/preview_cleanup.py github-output --pull-request '${{ github.event.pull_request.number }}' \
            >> "$GITHUB_OUTPUT"

  cleanup:
    if: needs.cleanup-target.outputs.found == 'true'
    needs: cleanup-target
    uses: ./.github/workflows/reusable-cloudflare-worker.yml
    with:
      enabled: true
      operation: destroy
      work-directory: ${{ needs.cleanup-target.outputs.work-directory }}
      stack-name: ${{ needs.cleanup-target.outputs.stack-name }}
      worker-name: ${{ needs.cleanup-target.outputs.worker-name }}
      source-ref: ${{ needs.cleanup-target.outputs.source-ref }}
      cloud-url: ${{ needs.cleanup-target.outputs.backend-url }}
      github-environment: preview
      comment-on-pr: true
      remove-stack: true

name: Clean up preview environment

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  queue: max
  cancel-in-progress: false

jobs:
  cleanup-target:
    runs-on: ubuntu-24.04
    outputs:
      found: ${{ steps.target.outputs.found }}
      work-directory: ${{ steps.target.outputs.work_directory }}
      backend-url: ${{ steps.target.outputs.backend_url }}
      stack-name: ${{ steps.target.outputs.stack_name }}
      worker-name: ${{ steps.target.outputs.worker_name }}
      project-name: ${{ steps.target.outputs.project_name }}
      source-ref: ${{ steps.target.outputs.source_ref }}
      comment-id: ${{ steps.target.outputs.comment_id }}
    steps:
      - name: Check out CI/CD cleanup helper
        uses: actions/checkout@v7
        with:
          # Keep the helper aligned with the workflow revision; never check out PR head code here.
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Recover recorded preview cleanup target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            | python .github/scripts/preview_cleanup.py github-output --pull-request '${{ github.event.pull_request.number }}' \
            >> "$GITHUB_OUTPUT"

  cleanup:
    if: needs.cleanup-target.outputs.found == 'true'
    needs: cleanup-target
    uses: ./.github/workflows/reusable-cloudflare-worker.yml
    with:
      enabled: true
      operation: destroy
      work-directory: ${{ needs.cleanup-target.outputs.work-directory }}
      stack-name: ${{ needs.cleanup-target.outputs.stack-name }}
      worker-name: ${{ needs.cleanup-target.outputs.worker-name }}
      project-name: ${{ needs.cleanup-target.outputs.project-name }}
      source-ref: ${{ needs.cleanup-target.outputs.source-ref }}
      cleanup-comment-id: ${{ needs.cleanup-target.outputs.comment-id }}
      expected-pr-state: closed
      cloud-url: ${{ needs.cleanup-target.outputs.backend-url }}
      github-environment: preview
      comment-on-pr: true
      remove-stack: true
    secrets:
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_WORKERS_DEV_SUBDOMAIN: ${{ secrets.CLOUDFLARE_WORKERS_DEV_SUBDOMAIN }}

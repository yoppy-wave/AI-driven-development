name: Clean up preview environment

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false
  queue: max

jobs:
  cleanup-target:
    runs-on: ubuntu-24.04
    outputs:
      found: ${{ steps.target.outputs.found }}
      stack-name: ${{ steps.target.outputs.stack_name }}
      region: ${{ steps.target.outputs.region }}
      source-ref: ${{ steps.target.outputs.source_ref }}
      workflow-ref: ${{ steps.target.outputs.workflow_ref }}
      account-id: ${{ steps.target.outputs.account_id }}
      comment-id: ${{ steps.target.outputs.comment_id }}
      cleanup-allowed: ${{ steps.current-pr.outputs.allowed }}
    steps:
      - name: Check out protected default-branch cleanup helper
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Recover recorded preview cleanup target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            | python .github/scripts/preview_cleanup.py github-output --pull-request '${{ github.event.pull_request.number }}' \
            >> "$GITHUB_OUTPUT"
      - name: Verify recorded cleanup helper is trusted
        if: steps.target.outputs.found == 'true'
        env:
          WORKFLOW_REF: ${{ steps.target.outputs.workflow_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          git merge-base --is-ancestor "$WORKFLOW_REF" "origin/$DEFAULT_BRANCH"
      - name: Confirm pull request remains closed
        id: current-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state="$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" --jq .state)"
          if [[ "$state" == closed ]]; then
            echo 'allowed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'allowed=false' >> "$GITHUB_OUTPUT"
          fi
  cleanup:
    if: needs.cleanup-target.outputs.found == 'true' && needs.cleanup-target.outputs.cleanup-allowed == 'true'
    needs: cleanup-target
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    environment:
      name: preview
    steps:
      - name: Check out protected default-branch cleanup helper
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ needs.cleanup-target.outputs.region }}
      - name: Verify CloudFormation cleanup target
        id: target
        env:
          EXPECTED_ACCOUNT_ID: ${{ needs.cleanup-target.outputs.account-id }}
          STACK_NAME: ${{ needs.cleanup-target.outputs.stack-name }}
          REGION: ${{ needs.cleanup-target.outputs.region }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          [[ "$STACK_NAME" == "app-pr-$PR_NUMBER" ]]
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          [[ -z "$EXPECTED_ACCOUNT_ID" || "$EXPECTED_ACCOUNT_ID" == "$account_id" ]]
          if ! stack="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$REGION" 2>/tmp/describe-error)"; then
            if grep -q 'does not exist' /tmp/describe-error; then
              echo 'exists=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cat /tmp/describe-error >&2
            exit 1
          fi
          status="$(jq -r '.Stacks[0].StackStatus' <<<"$stack")"
          if [[ "$status" == DELETE_COMPLETE ]]; then
            echo 'exists=false' >> "$GITHUB_OUTPUT"
            echo 'completed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$status" == DELETE_IN_PROGRESS ]]; then
            echo 'exists=false' >> "$GITHUB_OUTPUT"
            echo 'deleting=true' >> "$GITHUB_OUTPUT"
            echo 'completed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jq -e --arg pr "$PR_NUMBER" '.Stacks[0].Tags | any(.Key == "app:managed-by" and .Value == "ai-driven-development") and any(.Key == "app:preview-pr" and .Value == $pr)' <<<"$stack" >/dev/null
          echo 'exists=true' >> "$GITHUB_OUTPUT"
          echo 'deleting=false' >> "$GITHUB_OUTPUT"
          echo 'completed=false' >> "$GITHUB_OUTPUT"
      - name: Mark cleanup target destroying
        if: steps.target.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(python .github/scripts/preview_cleanup.py update-body --pull-request '${{ github.event.pull_request.number }}' --stack-name '${{ needs.cleanup-target.outputs.stack-name }}' --region '${{ needs.cleanup-target.outputs.region }}' --source-ref '${{ needs.cleanup-target.outputs.source-ref }}' --workflow-ref '${{ needs.cleanup-target.outputs.workflow-ref }}' --account-id '${{ needs.cleanup-target.outputs.account-id }}' --status destroying)"
          gh api --method PATCH "repos/${{ github.repository }}/issues/comments/${{ needs.cleanup-target.outputs.comment-id }}" -f body="$body"
      - name: Confirm pull request remains closed before deletion
        if: steps.target.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" --jq .state)" = closed
      - name: Delete preview CloudFormation stack
        if: steps.target.outputs.exists == 'true'
        run: |
          aws cloudformation delete-stack --stack-name '${{ needs.cleanup-target.outputs.stack-name }}' --region '${{ needs.cleanup-target.outputs.region }}'
          aws cloudformation wait stack-delete-complete --stack-name '${{ needs.cleanup-target.outputs.stack-name }}' --region '${{ needs.cleanup-target.outputs.region }}'
      - name: Wait for in-progress preview stack deletion
        if: steps.target.outputs.deleting == 'true'
        run: aws cloudformation wait stack-delete-complete --stack-name '${{ needs.cleanup-target.outputs.stack-name }}' --region '${{ needs.cleanup-target.outputs.region }}'
      - name: Mark cleanup target destroyed
        if: steps.target.outputs.exists == 'true' || steps.target.outputs.deleting == 'true' || steps.target.outputs.completed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(python .github/scripts/preview_cleanup.py update-body --pull-request '${{ github.event.pull_request.number }}' --stack-name '${{ needs.cleanup-target.outputs.stack-name }}' --region '${{ needs.cleanup-target.outputs.region }}' --source-ref '${{ needs.cleanup-target.outputs.source-ref }}' --workflow-ref '${{ needs.cleanup-target.outputs.workflow-ref }}' --account-id '${{ needs.cleanup-target.outputs.account-id }}' --status destroyed)"
          gh api --method PATCH "repos/${{ github.repository }}/issues/comments/${{ needs.cleanup-target.outputs.comment-id }}" -f body="$body"
name: Application CI/CD

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main, stg, prod]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy when enabled by configuration.
        required: true
        type: choice
        options: [development, staging, production]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: cicd-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/reusable-ci.yml
    secrets: inherit

  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && needs.ci.outputs.pulumi-enabled == 'true'
    needs: ci
    uses: ./.github/workflows/reusable-cloudflare-worker.yml
    with:
      enabled: true
      operation: preview
      work-directory: ${{ needs.ci.outputs.pulumi-work-directory }}
      stack-name: ${{ format('{0}-pr-{1}', needs.ci.outputs.stack-prefix, github.event.pull_request.number) }}
      worker-name: ${{ format('{0}-pr-{1}', needs.ci.outputs.worker-prefix, github.event.pull_request.number) }}
      cloud-url: ${{ needs.ci.outputs.pulumi-backend-url }}
      github-environment: preview
      comment-on-pr: true
    secrets: inherit

  preview-environment:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && needs.ci.outputs.preview-environment-enabled == 'true'
    needs: ci
    uses: ./.github/workflows/reusable-cloudflare-worker.yml
    with:
      enabled: true
      operation: up
      work-directory: ${{ needs.ci.outputs.pulumi-work-directory }}
      stack-name: ${{ format('{0}-pr-{1}', needs.ci.outputs.stack-prefix, github.event.pull_request.number) }}
      worker-name: ${{ format('{0}-pr-{1}', needs.ci.outputs.worker-prefix, github.event.pull_request.number) }}
      cloud-url: ${{ needs.ci.outputs.pulumi-backend-url }}
      github-environment: preview
      comment-on-pr: true
    secrets: inherit

  deploy-development:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci.outputs.development-enabled == 'true') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'development' && needs.ci.outputs.development-enabled == 'true')
    needs: ci
    uses: ./.github/workflows/reusable-cloudflare-worker.yml
    with:
      enabled: true
      operation: up
      work-directory: ${{ needs.ci.outputs.pulumi-work-directory }}
      stack-name: ${{ format('{0}-dev', needs.ci.outputs.stack-prefix) }}
      worker-name: ${{ format('{0}-dev', needs.ci.outputs.worker-prefix) }}
      cloud-url: ${{ needs.ci.outputs.pulumi-backend-url }}
      github-environment: development
    secrets: inherit

  deploy-staging:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/stg' && needs.ci.outputs.staging-enabled == 'true') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging' && needs.ci.outputs.staging-enabled == 'true')
    needs: ci
    uses: ./.github/workflows/reusable-cloudflare-worker.yml
    with:
      enabled: true
      operation: up
      work-directory: ${{ needs.ci.outputs.pulumi-work-directory }}
      stack-name: ${{ format('{0}-stg', needs.ci.outputs.stack-prefix) }}
      worker-name: ${{ format('{0}-stg', needs.ci.outputs.worker-prefix) }}
      cloud-url: ${{ needs.ci.outputs.pulumi-backend-url }}
      github-environment: staging
    secrets: inherit

  deploy-production:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/prod' && needs.ci.outputs.production-enabled == 'true') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production' && needs.ci.outputs.production-enabled == 'true')
    needs: ci
    uses: ./.github/workflows/reusable-cloudflare-worker.yml
    with:
      enabled: true
      operation: up
      work-directory: ${{ needs.ci.outputs.pulumi-work-directory }}
      stack-name: ${{ format('{0}-prod', needs.ci.outputs.stack-prefix) }}
      worker-name: ${{ format('{0}-prod', needs.ci.outputs.worker-prefix) }}
      cloud-url: ${{ needs.ci.outputs.pulumi-backend-url }}
      github-environment: production
    secrets: inherit

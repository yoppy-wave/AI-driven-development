name: Reusable Cloudflare Worker deployment

on:
  workflow_call:
    outputs:
      cleanup-comment-id:
        description: Preview cleanup locator recorded before a Pulumi operation that may create a stack.
        value: ${{ jobs.pulumi.outputs.cleanup-comment-id }}
    inputs:
      enabled:
        description: Whether this operation is permitted by repository configuration.
        required: true
        type: boolean
      operation:
        description: "Pulumi command to run: preview, up, or destroy."
        required: true
        type: string
      work-directory:
        description: Directory containing Pulumi.yaml and package.json.
        required: true
        type: string
      project-name:
        description: Name declared by Pulumi.yaml.
        required: true
        type: string
      stack-name:
        description: Target Pulumi stack.
        required: true
        type: string
      worker-name:
        description: Cloudflare Worker script name.
        required: true
        type: string
      cloud-url:
        description: Optional Pulumi backend URL.
        required: false
        type: string
        default: ""
      github-environment:
        description: GitHub Environment used for deployment approvals and environment secrets.
        required: true
        type: string
      source-ref:
        description: Optional immutable commit to check out before running Pulumi.
        required: false
        type: string
        default: ""
      expected-pr-state:
        description: Require this PR state before operating. Open updates also require source-ref to match the current PR head.
        required: false
        type: string
        default: ""
      comment-on-pr:
        description: Whether Pulumi should update a pull request comment.
        required: false
        type: boolean
        default: false
      remove-stack:
        description: Delete the stack after a successful destroy. Only valid for PR preview stacks.
        required: false
        type: boolean
        default: false
      record-preview-cleanup:
        description: Create or update a pending cleanup locator before a Pulumi operation that may create a stack.
        required: false
        type: boolean
        default: false
      cleanup-comment-id:
        description: Existing cleanup locator comment to update for an up or mark destroyed after a destroy.
        required: false
        type: string
        default: ""
    secrets:
      PULUMI_ACCESS_TOKEN:
        description: Pulumi backend access token. An Environment Secret with this name takes precedence.
        required: false
      PULUMI_CONFIG_PASSPHRASE:
        description: Optional Pulumi configuration passphrase. An Environment Secret with this name takes precedence.
        required: false
      CLOUDFLARE_API_TOKEN:
        description: Cloudflare API token. An Environment Secret with this name takes precedence.
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        description: Cloudflare account identifier. An Environment Secret with this name takes precedence.
        required: false
      CLOUDFLARE_WORKERS_DEV_SUBDOMAIN:
        description: Workers development subdomain. An Environment Secret with this name takes precedence.
        required: false
permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  pulumi:
    if: inputs.enabled
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: ${{ inputs.github-environment }}
    outputs:
      cleanup-comment-id: ${{ steps.cleanup-target.outputs.cleanup-comment-id }}
    steps:
      - name: Reject unsupported operation
        if: inputs.operation != 'preview' && inputs.operation != 'up' && inputs.operation != 'destroy'
        run: |
          echo "Unsupported Pulumi operation: ${{ inputs.operation }}" >&2
          exit 1

      - name: Restrict stack deletion to preview stacks
        if: inputs.remove-stack && !startsWith(inputs.stack-name, 'pr-') && !contains(inputs.stack-name, '-pr-')
        run: |
          echo 'Only pull request preview stacks may be deleted automatically.' >&2
          exit 1

      - name: Validate preview cleanup locator operation
        if: (inputs.record-preview-cleanup && inputs.operation != 'up') || (inputs.cleanup-comment-id != '' && inputs.operation != 'destroy' && !inputs.record-preview-cleanup)
        run: |
          echo 'Cleanup locators are only valid for preview up or destroy operations.' >&2
          exit 1

      - name: Confirm pull request still permits this operation
        if: inputs.expected-pr-state != ''
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_STATE: ${{ inputs.expected-pr-state }}
          SOURCE_REF: ${{ inputs.source-ref }}
        run: |
          state="$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" --jq '.state')"
          if [[ "$state" != "$EXPECTED_STATE" ]]; then
            echo "PREVIEW_OPERATION_ALLOWED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          if [[ "$EXPECTED_STATE" == 'open' ]]; then
            head_sha="$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" --jq '.head.sha')"
            if [[ "$head_sha" != "$SOURCE_REF" ]]; then
              echo "PREVIEW_OPERATION_ALLOWED=false" >> "$GITHUB_ENV"
              exit 0
            fi
          fi
          echo "PREVIEW_OPERATION_ALLOWED=true" >> "$GITHUB_ENV"

      - name: Check required deployment settings
        if: env.PREVIEW_OPERATION_ALLOWED != 'false'
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_DEV_SUBDOMAIN: ${{ secrets.CLOUDFLARE_WORKERS_DEV_SUBDOMAIN }}
        run: |
          required=(PULUMI_ACCESS_TOKEN CLOUDFLARE_API_TOKEN)
          if [[ '${{ inputs.operation }}' != 'destroy' ]]; then
            required+=(CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_WORKERS_DEV_SUBDOMAIN)
          fi
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name must be configured before enabling this Pulumi operation."
              exit 1
            fi
          done

      - name: Check out source
        if: env.PREVIEW_OPERATION_ALLOWED != 'false'
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        if: env.PREVIEW_OPERATION_ALLOWED != 'false' && inputs.operation != 'destroy'
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install infrastructure dependencies
        if: env.PREVIEW_OPERATION_ALLOWED != 'false' && inputs.operation != 'destroy'
        working-directory: ${{ inputs.work-directory }}
        run: npm ci

      - name: Record pending preview cleanup target
        id: cleanup-target
        if: env.PREVIEW_OPERATION_ALLOWED != 'false' && inputs.record-preview-cleanup
        env:
          GH_TOKEN: ${{ github.token }}
          EXISTING_CLEANUP_COMMENT_ID: ${{ inputs.cleanup-comment-id }}
        run: |
          body="$(python .github/scripts/preview_cleanup.py update-body \
            --pull-request '${{ github.event.pull_request.number }}' \
            --work-directory '${{ inputs.work-directory }}' \
            --project-name '${{ inputs.project-name }}' \
            --stack-name '${{ inputs.stack-name }}' \
            --worker-name '${{ inputs.worker-name }}' \
            --backend-url '${{ inputs.cloud-url }}' \
            --source-ref '${{ inputs.source-ref }}' \
            --status pending)"
          if [[ -n "$EXISTING_CLEANUP_COMMENT_ID" ]]; then
            gh api --method PATCH "repos/${{ github.repository }}/issues/comments/$EXISTING_CLEANUP_COMMENT_ID" -f body="$body"
            comment_id="$EXISTING_CLEANUP_COMMENT_ID"
          else
            comment_id="$(gh api --method POST "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" -f body="$body" --jq '.id')"
          fi
          echo "CLEANUP_COMMENT_ID=$comment_id" >> "$GITHUB_ENV"
          echo "cleanup-comment-id=$comment_id" >> "$GITHUB_OUTPUT"

      - name: Reconfirm pull request immediately before Pulumi
        if: env.PREVIEW_OPERATION_ALLOWED != 'false' && inputs.expected-pr-state != ''
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_STATE: ${{ inputs.expected-pr-state }}
          SOURCE_REF: ${{ inputs.source-ref }}
        run: |
          state="$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" --jq '.state')"
          if [[ "$state" != "$EXPECTED_STATE" ]]; then
            echo "PREVIEW_OPERATION_ALLOWED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          if [[ "$EXPECTED_STATE" == 'open' ]]; then
            head_sha="$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" --jq '.head.sha')"
            if [[ "$head_sha" != "$SOURCE_REF" ]]; then
              echo "PREVIEW_OPERATION_ALLOWED=false" >> "$GITHUB_ENV"
            fi
          fi

      - name: Run Pulumi ${{ inputs.operation }}
        if: env.PREVIEW_OPERATION_ALLOWED != 'false'
        uses: pulumi/actions@v7
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_DEV_SUBDOMAIN: ${{ secrets.CLOUDFLARE_WORKERS_DEV_SUBDOMAIN }}
          CLOUDFLARE_WORKER_NAME: ${{ inputs.worker-name }}
        with:
          command: ${{ inputs.operation }}
          pulumi-version-file: ${{ github.workspace }}/.pulumi.version
          work-dir: ${{ inputs.work-directory }}
          stack-name: ${{ inputs.stack-name }}
          cloud-url: ${{ inputs.cloud-url }}
          upsert: ${{ inputs.operation != 'destroy' }}
          diff: true
          comment-on-pr: ${{ inputs.comment-on-pr }}
          suppress-outputs: true
          remove: ${{ inputs.remove-stack }}
          github-token: ${{ github.token }}

      - name: Smoke test deployed Worker
        if: env.PREVIEW_OPERATION_ALLOWED != 'false' && inputs.operation == 'up'
        env:
          CLOUDFLARE_WORKERS_DEV_SUBDOMAIN: ${{ secrets.CLOUDFLARE_WORKERS_DEV_SUBDOMAIN }}
          WORKER_NAME: ${{ inputs.worker-name }}
        run: |
          worker_url="https://${WORKER_NAME}.${CLOUDFLARE_WORKERS_DEV_SUBDOMAIN}.workers.dev/"
          curl --fail --retry 5 --retry-all-errors --retry-delay 2 --show-error --silent "$worker_url"
          {
            echo '## Cloudflare Worker smoke test'
            echo
            echo "- URL: $worker_url"
            echo '- Result: passed'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Mark cleanup locator complete
        if: env.PREVIEW_OPERATION_ALLOWED != 'false' && ((inputs.operation == 'up' && inputs.record-preview-cleanup) || inputs.cleanup-comment-id != '')
        env:
          GH_TOKEN: ${{ github.token }}
          EXISTING_CLEANUP_COMMENT_ID: ${{ inputs.cleanup-comment-id }}
          CLEANUP_STATUS: ${{ inputs.record-preview-cleanup && 'active' || 'destroyed' }}
        run: |
          comment_id="${EXISTING_CLEANUP_COMMENT_ID:-${CLEANUP_COMMENT_ID:-}}"
          if [[ -z "$comment_id" ]]; then
            echo 'A cleanup locator comment ID is required to record a completed operation.' >&2
            exit 1
          fi
          body="$(python .github/scripts/preview_cleanup.py update-body \
            --pull-request '${{ github.event.pull_request.number }}' \
            --work-directory '${{ inputs.work-directory }}' \
            --project-name '${{ inputs.project-name }}' \
            --stack-name '${{ inputs.stack-name }}' \
            --worker-name '${{ inputs.worker-name }}' \
            --backend-url '${{ inputs.cloud-url }}' \
            --source-ref '${{ inputs.source-ref }}' \
            --status "$CLEANUP_STATUS")"
          gh api --method PATCH "repos/${{ github.repository }}/issues/comments/$comment_id" -f body="$body"

      - name: Publish skipped stale operation
        if: env.PREVIEW_OPERATION_ALLOWED == 'false'
        run: |
          echo 'Preview operation skipped because the pull request state or head SHA changed.' >> "$GITHUB_STEP_SUMMARY"

  skipped:
    if: ${{ !inputs.enabled }}
    runs-on: ubuntu-24.04
    steps:
      - name: Publish skipped operation
        run: |
          {
            echo '## Pulumi operation skipped'
            echo
            echo "- Operation: \\`${{ inputs.operation }}\\`"
            echo '- Reason: the repository CI/CD configuration has this deployment path disabled.'
          } >> "$GITHUB_STEP_SUMMARY"
